# electron-builder 配置（只在打 exe 时用；日常开发/测试完全不需要它）
#
# 装 electron 不会写进 package.json 的 dependencies：宿主是零依赖的，
# electron 只在「打包这一步」由 CI 临时安装（见 .github/workflows/release.yml）。
appId: com.somwhy.pidshpet
productName: pi-dsh-pet
copyright: MIT

directories:
  output: dist
  # buildResources：图标等资源目录。没建也不会报错，只是用 Electron 默认图标。
  buildResources: build

# 打包完删掉用不到的 Electron 自带文件（现在只有 D3D12 的 dxcompiler/dxil，白带 26MB）。
# 为什么不写在 files 里：files 只管**打进去**什么，删 electron 自己的文件得走钩子。
afterPack: scripts/after-pack.cjs

# 只带运行时要的东西：宿主代码 + 窗代码 + 91 个 webm 素材。
# ⚠️ 每一项都加引号：YAML 里裸的 * 会被当 alias，而且未加引号的通配写法
# 在不同 glob 实现下对「零层子目录」（app/main.cjs 之于 app/**/*.cjs）匹配不一致，
# 漏掉文件的表现是「exe 打出来了，双击窗里啥也没有」——所以这里用 **/* 明确收全部。
files:
  - "app/**/*"
  - "bin/**/*"
  - "pi/assets/**/*"
  - "assets/thumb/**/*"
  - "assets/config.jsonc"
  - "package.json"

# ---- 体积：portable 单文件的三大块，只有第三块能自己说了算 ----
# ① Electron 运行时 ~147MB（压缩后 ~74MB）：动不了，除非换运行时。
# ② locales/ 41MB（未压缩）：**整块砍掉**。Electron 默认带 50+ 种语言包，这里只
#    用得到 zh-CN（界面/菜单）与 en-US（兜底），其余 39 个 .pak 纯占位。
#    .pak 本身压得动一部分，portable 大体能省下十几 MB。
# ③ assets/thumb/*.webm 46MB：VP9 已经压过，7z 再压几乎没收益，只能靠
#    `npm run slim:assets`（ffmpeg 重编码降分辨率/码率）真省，详见 README。
electronLanguages:
  - zh-CN
  - en-US

# maximum：7z 用 -mx=9。素材压不动，但 Electron 那 147MB 里的 dll/exe/pak 能压出几个点。
# 代价是打包慢几分钟（CI 有的是时间）。
compression: maximum

win:
  # 只出 portable 单文件 exe（双击即用，免安装）。**不再出 NSIS 安装包**：
  # 用户只要一个能双击的 exe，安装版反而让人多一步、release 里还多一个 120MB 的附件。
  target:
    - target: portable
      arch: [x64]
  # 产物名**不带版本号**，就叫这个固定名：pi-dsh-pet.exe —— 用户双击的就是它。
  # 为什么不带版本号：版本号规则是 YYYY.MM.DD.NNNN（2026.09.30.0002），**不是合法 semver**
  # （三段后还有一段），electron-builder 会自己规范化它。实测打出来是：
  #   2026.09.30.0002 → ${version} 变成 2026.9.3-0.2
  # 也就是说名字里塞版本号，既不可控（下次规范化规则变了名字又变）又难看。
  # 版本信息没丢：tag（v2026.09.30.0002）、release、asar 里的 package.json 都还在。
  artifactName: pi-dsh-pet.${ext}

  # 关掉 electron-builder 自带的「改 exe 资源」那一步（默认开着），改由
  # scripts/after-pack.cjs 用 resedit 写同样的版本信息。**别随手改回 true**：
  # 那一步的 rcedit 走 BeginUpdateResource/EndUpdateResource，会把 180MB 的 exe
  # 整个重写；机器上装着实时防护时文件正被扫描，句柄没放开 →
  #   Fatal error: Unable to commit changes
  # electron-builder 连重试 4 次都在几秒之内、扫描没结束，于是整个 build 红掉，
  # 报错还指不到本仓库任何文件。实验记录见 scripts/after-pack.cjs 的 writeVersionInfo。
  # 顺带丢掉的图标与代码签名本项目本来就没有（无 build/ 图标目录、无证书，
  # manifest 默认 asInvoker），产物和以前一样。⚠️ 将来要换图标也得在这里补。
  signAndEditExecutable: false

portable:
  # 固定名：双击即用的那一个，见上面 win.artifactName 里的说明
  artifactName: pi-dsh-pet.${ext}
