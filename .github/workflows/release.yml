name: release

# 什么时候跑：
#   - 手动触发（workflow_dispatch）
#   - 打 tag（tag 本身就是版本号时）
#   - 推 main（自动算一个当天版本号）
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只算版本号、跑测试、传源码，不打 exe、不建 tag、不发 release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- 1. 版本号 + 源码包
  version:
    name: 版本号 + 源码包
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 要数 tag，浅克隆不够

      - id: v
        name: 算版本号 YYYY.MM.DD.NNNN
        run: |
          set -euo pipefail
          TODAY="$(date -u +%Y.%m.%d)"
          # 推 tag 时就用 tag 上的版本；推 main / 手动时按当天序号往后排
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            N=$(git tag --list "v${TODAY}.*" | wc -l | tr -d ' ')
            VER="$(printf '%s.%04d' "$TODAY" $((N + 1)))"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          {
            echo "## 版本号 $VER"
            echo ""
            echo "- 规则：\`YYYY.MM.DD.NNNN\`（UTC 日期 + 当天第几个）"
            echo "- tag：\`v${VER}\`"
            echo "- 当天已有 tag 数：$(git tag --list "v${TODAY}.*" | tr '\n' ' ')"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 装依赖（宿主零依赖，这一步基本是空跑）
        run: npm install --no-audit --no-fund

      - name: 跑测试
        run: npm test

      - name: 把 package.json 的 version 写成算出来的版本号
        run: node scripts/set-version.cjs "${{ steps.v.outputs.version }}"

      # 注意：这一段里出现的 $VERSION 必须由 env: 提供。Actions 的 env 只挂在**本 step**，
      # 挂在上一个 step 上是没用的 —— 少了就会 `set -u` 直接退出，job 变红。
      - name: 打包 source code
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # 版本号只写进 zip 里的那棵树（git write-tree = 拿暂存区写个 tree 对象），
          # 不动 git 历史：CI 不产生提交，main 不会被推走，本地 push 也不会被拒。
          git add -A
          TREE="$(git write-tree)"
          git archive --format=zip --prefix="pi-dsh-pet-${VERSION}/" \
            -o "dist/pi-dsh-pet-${VERSION}-source.zip" "$TREE"
          ls -l dist
          # 自检：zip 里的 package.json 必须是刚算出来的版本号（unzip 不一定有，没有就跳过）
          if command -v unzip >/dev/null 2>&1; then
            unzip -p "dist/pi-dsh-pet-${VERSION}-source.zip" "pi-dsh-pet-${VERSION}/package.json" | grep '"version"'
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pi-dsh-pet-${{ steps.v.outputs.version }}-source
          path: dist/pi-dsh-pet-*-source.zip
          if-no-files-found: error

      - name: 建 tag 并推
        # dry_run 明确承诺「不建 tag」；tag push 时版本号就是 tag 本身，别重复建
        if: ${{ github.ref_type != 'tag' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
        run: |
          set -euo pipefail
          TAG="${{ steps.v.outputs.tag }}"
          # 重跑同一个 run / 再手动触发一次时 tag 可能已经在：复用它，别把 job 搞红
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "tag ${TAG} 已存在，复用（不重建）"
            git ls-remote --tags origin "refs/tags/${TAG}"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "release ${{ steps.v.outputs.version }}"
          git push origin "refs/tags/${TAG}"

  # ---------------------------------------------------------------- 2. 打 Windows exe
  exe:
    name: 打 Windows exe
    needs: version
    # push 事件里 inputs 为 null，null != true，所以老写法在 push 时是对的；
    # 这里换成显式判断，dry_run 才真的只跳过 exe（手动触发时）。
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 同步版本号
        run: node scripts/set-version.cjs "${{ needs.version.outputs.version }}"

      # electron / electron-builder 只在这一步装，仓库本身保持零依赖
      - name: 装打包工具
        run: |
          npm install --no-audit --no-fund --no-save --package-lock=false electron@33 electron-builder@25

      # electronVersion 显式给出去，别让 builder 去猜（仓库 package.json 里没有 electron 依赖）
      - name: 打 exe
        run: |
          $v = node -p "JSON.parse(require('fs').readFileSync('node_modules/electron/package.json','utf8')).version"
          Write-Host "electron $v"
          npx electron-builder --win --config electron-builder.yml "-c.electronVersion=$v"

      - name: 传产物
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: pi-dsh-pet-${{ needs.version.outputs.version }}-win-x64
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml

  # ---------------------------------------------------------------- 3. 发 Release
  release:
    name: 发 Release
    needs: [version, exe]
    # exe 失败也照样发（至少把源码放出去）；dry_run 则一律不发
    if: ${{ always() && needs.version.result == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 组装 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: pi-dsh-pet ${{ needs.version.outputs.version }}
          body: |
            版本 `${{ needs.version.outputs.version }}`（规则 `YYYY.MM.DD.NNNN`）

            - 📦 源码：`*source.zip`
            - 🖥 独立 exe（Windows x64，免安装）：`*portable.exe`
            - 💾 安装包（带快捷方式）：`*x64.exe`

            用法：`pi-dsh-pet.exe` 双击即可（自带服务+窗）；pi/dsh 侧用 `pi-pet start` 或
            让 pi 扩展自动拉起，端口/token 见 `pi-pet status`。
          files: |
            artifacts/**/*
          fail_on_unmatched_files: false
